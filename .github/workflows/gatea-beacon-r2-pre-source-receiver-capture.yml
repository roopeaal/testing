name: Gate-A Beacon R2 pre-source receiver capture

on:
  push:
    paths:
      - '.github/workflows/gatea-beacon-r2-pre-source-receiver-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Capture exact NIST receiver before future drand source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capture/pulses
          python3 - <<'PY'
          import urllib.request, urllib.error, json, hashlib, time, pathlib, datetime

          CHAIN = 2
          START = 1932017
          END = 1932528
          TARGET_UTC = '2026-09-08T20:30:03Z'
          LAST_URI = 'https://beacon.nist.gov/beacon/2.0/chain/2/pulse/1932528'
          LAST_TS = '2026-09-08T14:22:00.000Z'
          LAST_LRV = '7164B8B7ABA409974D9A3DF1461F16FF34D5FD4F474A624DC3E8843359A1BC7351284C211CE6DF576D09C21C7ED1A872BBD651191602513DE087A0687790ABB8'
          LAST_CERT = '87f27f431da3f584af6007fe045df13aaa81d831f335b6ee73f6334768f32d3ae10491e669b93a43e548b20370a6526c3def99643c25d8ad7bf5df95a3c2b45d'

          root = pathlib.Path('capture')
          receiver = bytearray()
          records = []
          previous_ts = None

          def get(url):
              last = None
              for attempt in range(8):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'ERCP-GateA-Beacon-R2-presource-capture/1.0'})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.read()
                  except Exception as e:
                      last = e
                      time.sleep(min(2**attempt, 20))
              raise RuntimeError(f'fetch failed {url}: {last}')

          for idx in range(START, END+1):
              url = f'https://beacon.nist.gov/beacon/2.0/chain/{CHAIN}/pulse/{idx}'
              raw = get(url)
              (root/'pulses'/f'{idx}.json').write_bytes(raw)
              obj = json.loads(raw)
              pulse = obj.get('pulse', obj)
              if int(pulse['chainIndex']) != CHAIN or int(pulse['pulseIndex']) != idx:
                  raise SystemExit(f'index mismatch at {idx}')
              if int(pulse.get('statusCode', 0)) != 0:
                  raise SystemExit(f'bad status at {idx}')
              lrv = pulse['localRandomValue']
              if len(lrv) != 128:
                  raise SystemExit(f'localRandomValue length at {idx}')
              receiver.extend(bytes.fromhex(lrv))
              ts = pulse['timeStamp']
              # ISO lexical order is valid here because all timestamps use UTC Z and same format.
              if previous_ts is not None and not (ts > previous_ts):
                  raise SystemExit(f'non-increasing timestamp at {idx}')
              if not (ts < TARGET_UTC):
                  raise SystemExit(f'receiver timestamp not before target at {idx}: {ts}')
              previous_ts = ts
              if idx > START:
                  prev = pulse.get('uri', {}).get('previous')
                  expected_prev = f'https://beacon.nist.gov/beacon/2.0/chain/{CHAIN}/pulse/{idx-1}'
                  if prev is not None and prev != expected_prev:
                      raise SystemExit(f'previous URI mismatch at {idx}: {prev}')
              records.append({
                  'chainIndex': int(pulse['chainIndex']),
                  'pulseIndex': int(pulse['pulseIndex']),
                  'timeStamp': ts,
                  'localRandomValue': lrv,
                  'certificateId': pulse.get('certificateId'),
                  'signatureValue': pulse.get('signatureValue'),
                  'uri': pulse.get('uri'),
                  'raw_sha256': hashlib.sha256(raw).hexdigest(),
              })

          if len(receiver) != 32768:
              raise SystemExit(f'receiver length {len(receiver)} != 32768 bytes')
          last = records[-1]
          if last['pulseIndex'] != END or last['timeStamp'] != LAST_TS or last['localRandomValue'] != LAST_LRV or last['certificateId'] != LAST_CERT:
              raise SystemExit('last-pulse pre-source anchor mismatch')
          last_uri_observed = f'https://beacon.nist.gov/beacon/2.0/chain/{CHAIN}/pulse/{last["pulseIndex"]}'
          if last_uri_observed != LAST_URI:
              raise SystemExit('last URI mismatch')

          (root/'receiver.bin').write_bytes(receiver)
          with (root/'receiver_records.jsonl').open('w', encoding='utf-8') as f:
              for rec in records:
                  f.write(json.dumps(rec, sort_keys=True, separators=(',',':'))+'\n')

          meta = {
              'protocol':'ERCP-GATEA-BEACON-R2-PRESOURCE-NIST-CAPTURE-v1',
              'captured_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'official_base':'https://beacon.nist.gov/beacon/2.0',
              'chain_index':CHAIN,
              'start_pulse_index':START,
              'end_pulse_index':END,
              'count':END-START+1,
              'field':'localRandomValue',
              'bit_order':'concatenate ascending pulseIndex, decode each 128 hex chars to 64 bytes, MSB-first bits',
              'receiver_bytes':len(receiver),
              'receiver_bits':len(receiver)*8,
              'receiver_sha256':hashlib.sha256(receiver).hexdigest(),
              'records_jsonl_sha256':hashlib.sha256((root/'receiver_records.jsonl').read_bytes()).hexdigest(),
              'last_pulse_anchor_verified':True,
              'all_timestamps_before_future_source':True,
              'strictly_increasing_timestamps':True,
              'future_source_round':32032013,
              'future_source_utc':TARGET_UTC,
          }
          (root/'receiver_meta.json').write_text(json.dumps(meta, indent=2), encoding='utf-8')

          # Stable manifest over every captured byte.
          entries=[]
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.name != 'SHA256SUMS.txt':
                  entries.append((hashlib.sha256(p.read_bytes()).hexdigest(), p.relative_to(root).as_posix()))
          (root/'SHA256SUMS.txt').write_text(''.join(f'{h}  {name}\n' for h,name in entries), encoding='utf-8')
          print(json.dumps(meta, indent=2))
          print('CAPTURE_PASS=true')
          PY

          echo '--- SHA256SUMS (key files) ---'
          sha256sum capture/receiver.bin capture/receiver_records.jsonl capture/receiver_meta.json capture/SHA256SUMS.txt

      - name: Upload immutable receiver snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: gatea-beacon-r2-pre-source-nist-receiver
          path: capture/
          if-no-files-found: error
          compression-level: 9
